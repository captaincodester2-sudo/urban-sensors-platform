apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
  namespace: urban-sensors
spec:
  replicas: 1
  selector:
    matchLabels:
      app: producer
  template:
    metadata:
      labels:
        app: producer
    spec:
      containers:
        - name: producer
          image: urban-producer:1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: urban-config