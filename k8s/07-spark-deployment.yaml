apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-streaming
  namespace: urban-sensors
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-streaming
  template:
    metadata:
      labels:
        app: spark-streaming
    spec:
      containers:
        - name: spark-streaming
          image: urban-spark:1.0
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "1Gi"
            limits:
              memory: "2Gi"
          envFrom:
            - configMapRef:
                name: spark-config